name: checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second push supersedes the first; the older run is cancelled rather than
# reporting on a state that is no longer main.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rule-ids:
    name: rule-id consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_rule_ids.py

  links:
    name: link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --no-progress .
          fail: true
