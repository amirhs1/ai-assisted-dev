name: Check tools

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    name: ShellCheck and fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: git ls-files -z 'scripts/*.sh' '.githooks/*' | xargs -0 shellcheck
      - name: Self-check
        run: sh scripts/check-repo.sh
